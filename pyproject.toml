[project]
name = "api-render-conware-powerautomate"
version = "2.0.0"
description = "API FastAPI para validación de pagos y automatización SharePoint (HBI Capital)"
requires-python = ">=3.12,<3.15"
readme = "README.md"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pypdf>=5.0.0",
    "reportlab>=4.0.0",
    "vercel>=0.5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python vercel_build_check.py"
